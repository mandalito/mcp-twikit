[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-twikit"
version = "0.1.0"
description = "Twitter search tool for FastMCP using Twikit"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Adhika Setya Pramudita", email = "adhika.setya.p@gmail.com" }
]
dependencies = [
    "fastmcp",
    # Private copy of twikit 2.3.3 with patches: article text, missing user fields, KEY_BYTE fix, reply cursors
    "twikit @ git+ssh://git@github.com/mandalito/twikit.git@b9361c6ad6c0b9791829e5d566b6e66a54f7f109",
    "requests",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/adhikasp/mcp-twikit"

[project.scripts]
mcp-twikit = "mcp_twikit.twitter:mcp.run"